name: CI Phase 1

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-phase1-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality-build-test:
    name: quality-build-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust 1.93.1
        uses: dtolnay/rust-toolchain@1.93.1
        with:
          components: rustfmt, clippy

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build (debug)
        run: cargo build --locked

      - name: Build (release)
        run: cargo build --release --locked

      - name: Unit and default tests
        run: cargo nextest run --locked

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Install cargo-audit (cached)
        run: cargo install cargo-audit@0.21.0 --locked

      - name: Run cargo-audit (advisory only)
        id: cargo_audit
        continue-on-error: true
        run: |
          mkdir -p target
          cargo audit --json > target/cargo-audit.json

      - name: Warn on cargo-audit findings
        if: steps.cargo_audit.outcome == 'failure'
        run: echo "::warning::cargo-audit reported findings. This is non-blocking in Phase 1."

      - name: Upload cargo-audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cargo-audit-report
          path: target/cargo-audit.json
          if-no-files-found: ignore
